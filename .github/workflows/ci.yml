name: CI
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Camada de segredos: procura chaves reais, não a palavra service_role (AUD-74)
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      # PR: só o afetado face ao ramo base (P0.6). Push para main: tudo.
      - name: Lint, typecheck, build, test
        run: pnpm turbo run lint typecheck build test ${{ github.event_name == 'pull_request' && format('--filter=...[origin/{0}]', github.base_ref) || '' }}
      - run: pnpm audit:tokens
      - name: Chromatic (UI snapshots)
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: echo "Chromatic ativo quando CHROMATIC_PROJECT_TOKEN estiver configurado (ver docs/chromatic-setup.md)"
      # pgTAP corre quando há migrações (ativa-se em P2.5)
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migrações + seeds + provas G-DB
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres <<'SQL'
          create schema auth;
          create table auth.users (id uuid primary key, email text, raw_user_meta_data jsonb default '{}'::jsonb, created_at timestamptz default now());
          create function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('app.uid', true), '')::uuid $$;
          do $b$ begin
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin bypassrls; end if;
          end $b$;
          grant usage on schema auth to authenticated, anon;
          SQL
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/0001_luna_os.sql
          psql -h localhost -U postgres -c "insert into auth.users (id,email) values ('00000000-0000-0000-0000-00000000c0a0','ci@luna.os');"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/0002_hardening.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/0003_security_fixes.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/seed_base.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/seed_extended.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/gdb_asserts.sql
