# LUNA.OS — Supabase local/cloud config
# Cloud: supabase login && supabase link --project-ref <ref>
# Local: supabase start (requer Docker)

project_id = "luna-os"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# Registo fechado (auditoria v3): contas novas só por convite.
# Na cloud, desligar também em Authentication → Sign In / Providers.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[realtime]
enabled = true
