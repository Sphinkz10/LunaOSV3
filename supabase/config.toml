# LUNA.OS — Supabase local/cloud config
# Cloud: supabase login && supabase link --project-ref <ref>
# Local: supabase start (requer Docker)

project_id = "luna-os"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# Registo aberto (o atleta usa a app de graça), mas a conta nova não tem papel
# nenhum até criar uma organização ou aceitar um convite (AUD-71).
enable_signup = true

[auth.email]
enable_signup = true
# Confirmação de email obrigatória (AUD-71). Na cloud: Authentication → Sign In / Providers → Email.
enable_confirmations = true

[realtime]
enabled = true
