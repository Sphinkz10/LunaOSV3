<!doctype html>
<html lang="pt-PT" data-theme="luna-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LUNA.OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // P1.4 (antecipado): aplicar preferências de layout/tema ANTES do 1º paint
      try {
        const s = JSON.parse(localStorage.getItem('luna.layout') || '{}');
        if (s.density) document.documentElement.dataset.density = s.density;
        if (s.textScale) document.documentElement.dataset.textScale = s.textScale;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
